services:
  postgres:
    image: postgres:16-alpine
    container_name: reconcile-postgres
    environment:
      POSTGRES_DB: reconcile
      POSTGRES_USER: ${DATABASE_USER:-reconcile}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Defina DATABASE_PASSWORD no arquivo .env (veja .env.example)}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - reconcile_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reconcile -d reconcile"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: reconcile-backend:local
    container_name: reconcile-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/reconcile
      DATABASE_USER: ${DATABASE_USER:-reconcile}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Defina DATABASE_PASSWORD no arquivo .env (veja .env.example)}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no arquivo .env (veja .env.example)}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8081,http://127.0.0.1:5173,http://127.0.0.1:8081}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      SEED_DEMO: ${SEED_DEMO:-true}
      SEED_LEDGER: ${SEED_LEDGER:-true}
      OAUTH_FRONTEND_REDIRECT: ${OAUTH_FRONTEND_REDIRECT:-http://localhost:5173/integracoes}
      MERCADO_LIVRE_CLIENT_ID: ${MERCADO_LIVRE_CLIENT_ID:-}
      MERCADO_LIVRE_CLIENT_SECRET: ${MERCADO_LIVRE_CLIENT_SECRET:-}
      MERCADO_LIVRE_REDIRECT_URI: ${MERCADO_LIVRE_REDIRECT_URI:-http://localhost:8080/api/v1/integrations/oauth/ml/callback}
      MERCADO_LIVRE_AUTHORIZE_URL: ${MERCADO_LIVRE_AUTHORIZE_URL:-https://auth.mercadolivre.com.br/authorization}
      MERCADO_LIVRE_TOKEN_URL: ${MERCADO_LIVRE_TOKEN_URL:-https://api.mercadolibre.com/oauth/token}
      MERCADO_LIVRE_API_URL: ${MERCADO_LIVRE_API_URL:-https://api.mercadolibre.com}
      MERCADO_LIVRE_PKCE: ${MERCADO_LIVRE_PKCE:-true}
      MERCADO_LIVRE_WEBHOOK_SECRET: ${MERCADO_LIVRE_WEBHOOK_SECRET:-}
      SHOPEE_PARTNER_ID: ${SHOPEE_PARTNER_ID:-}
      SHOPEE_PARTNER_KEY: ${SHOPEE_PARTNER_KEY:-}
      SHOPEE_REDIRECT_URI: ${SHOPEE_REDIRECT_URI:-http://localhost:8080/api/v1/integrations/oauth/shopee/callback}
      SHOPEE_AUTHORIZE_URL: ${SHOPEE_AUTHORIZE_URL:-https://open.shopee.com.br/auth}
      SHOPEE_TOKEN_URL: ${SHOPEE_TOKEN_URL:-https://openplatform.shopee.com.br/api/v2/auth/token/get}
      SHOPEE_API_URL: ${SHOPEE_API_URL:-https://openplatform.shopee.com.br}
      SHOPEE_PUSH_URL: ${SHOPEE_PUSH_URL:-}
      OLX_CLIENT_ID: ${OLX_CLIENT_ID:-}
      OLX_CLIENT_SECRET: ${OLX_CLIENT_SECRET:-}
      OLX_REDIRECT_URI: ${OLX_REDIRECT_URI:-http://localhost:8080/api/v1/integrations/oauth/olx/callback}
      OLX_AUTHORIZE_URL: ${OLX_AUTHORIZE_URL:-https://auth.olx.com.br/oauth}
      OLX_TOKEN_URL: ${OLX_TOKEN_URL:-https://auth.olx.com.br/oauth/token}
      OLX_API_URL: ${OLX_API_URL:-https://apps.olx.com.br}
      OLX_SCOPE: ${OLX_SCOPE:-basic_user_info autoupload autoservice}
      OLX_WEBHOOK_URL: ${OLX_WEBHOOK_URL:-}
      OLX_DELETE_SOLD_ADS: ${OLX_DELETE_SOLD_ADS:-false}
      AMAZON_CLIENT_ID: ${AMAZON_CLIENT_ID:-}
      AMAZON_CLIENT_SECRET: ${AMAZON_CLIENT_SECRET:-}
      AMAZON_REDIRECT_URI: ${AMAZON_REDIRECT_URI:-http://localhost:8080/api/v1/integrations/oauth/amazon/callback}
      AMAZON_AUTHORIZE_URL: ${AMAZON_AUTHORIZE_URL:-https://sellercentral.amazon.com.br/apps/authorize/consent}
      AMAZON_TOKEN_URL: ${AMAZON_TOKEN_URL:-https://api.amazon.com/auth/o2/token}
      AMAZON_API_URL: ${AMAZON_API_URL:-https://sellingpartnerapi-na.amazon.com}
      AMAZON_AWS_ACCESS_KEY: ${AMAZON_AWS_ACCESS_KEY:-}
      AMAZON_AWS_SECRET_KEY: ${AMAZON_AWS_SECRET_KEY:-}
      AMAZON_AWS_SESSION_TOKEN: ${AMAZON_AWS_SESSION_TOKEN:-}
      AMAZON_AWS_REGION: ${AMAZON_AWS_REGION:-us-east-1}
      AMAZON_MARKETPLACE_ID: ${AMAZON_MARKETPLACE_ID:-A2Q3Y263D00KWC}
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

volumes:
  reconcile_pg:
