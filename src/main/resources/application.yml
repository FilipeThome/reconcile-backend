spring:
  application:
    name: reconcile-backend
  http:
    client:
      # Marketplace calls run while a SKU is locked: a hung call must not stall its sales forever.
      connect-timeout: 5s
      read-timeout: 20s
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/reconcile}
    username: ${DATABASE_USER:reconcile}
    password: ${DATABASE_PASSWORD:reconcile}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    placeholders:
      seed_demo: ${SEED_DEMO:true}
      seed_ledger: ${SEED_LEDGER:true}

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false
  forward-headers-strategy: none

reconcile:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-hours: 12
  cors:
    origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:8081,http://127.0.0.1:5173,http://127.0.0.1:8081}
  auth:
    trusted-proxies: ${TRUSTED_PROXIES:}
  oauth:
    frontend-redirect: ${OAUTH_FRONTEND_REDIRECT:http://localhost:5173/integracoes}
    mercado-livre:
      client-id: ${MERCADO_LIVRE_CLIENT_ID:}
      client-secret: ${MERCADO_LIVRE_CLIENT_SECRET:}
      redirect-uri: ${MERCADO_LIVRE_REDIRECT_URI:http://localhost:8080/api/v1/integrations/oauth/ml/callback}
      authorize-url: ${MERCADO_LIVRE_AUTHORIZE_URL:https://auth.mercadolivre.com.br/authorization}
      token-url: ${MERCADO_LIVRE_TOKEN_URL:https://api.mercadolibre.com/oauth/token}
      api-url: ${MERCADO_LIVRE_API_URL:https://api.mercadolibre.com}
      pkce: ${MERCADO_LIVRE_PKCE:true}
      webhook-secret: ${MERCADO_LIVRE_WEBHOOK_SECRET:}
    shopee:
      client-id: ${SHOPEE_PARTNER_ID:}
      client-secret: ${SHOPEE_PARTNER_KEY:}
      redirect-uri: ${SHOPEE_REDIRECT_URI:http://localhost:8080/api/v1/integrations/oauth/shopee/callback}
      authorize-url: ${SHOPEE_AUTHORIZE_URL:https://open.shopee.com.br/auth}
      token-url: ${SHOPEE_TOKEN_URL:https://openplatform.shopee.com.br/api/v2/auth/token/get}
      api-url: ${SHOPEE_API_URL:https://openplatform.shopee.com.br}
      webhook-url: ${SHOPEE_PUSH_URL:}
    amazon:
      client-id: ${AMAZON_CLIENT_ID:}
      client-secret: ${AMAZON_CLIENT_SECRET:}
      redirect-uri: ${AMAZON_REDIRECT_URI:http://localhost:8080/api/v1/integrations/oauth/amazon/callback}
      authorize-url: ${AMAZON_AUTHORIZE_URL:https://sellercentral.amazon.com.br/apps/authorize/consent}
      token-url: ${AMAZON_TOKEN_URL:https://api.amazon.com/auth/o2/token}
      api-url: ${AMAZON_API_URL:https://sellingpartnerapi-na.amazon.com}
      pkce: false
      aws-access-key: ${AMAZON_AWS_ACCESS_KEY:}
      aws-secret-key: ${AMAZON_AWS_SECRET_KEY:}
      aws-session-token: ${AMAZON_AWS_SESSION_TOKEN:}
      aws-region: ${AMAZON_AWS_REGION:us-east-1}
      marketplace-id: ${AMAZON_MARKETPLACE_ID:A2Q3Y263D00KWC}
    olx:
      client-id: ${OLX_CLIENT_ID:}
      client-secret: ${OLX_CLIENT_SECRET:}
      redirect-uri: ${OLX_REDIRECT_URI:http://localhost:8080/api/v1/integrations/oauth/olx/callback}
      authorize-url: ${OLX_AUTHORIZE_URL:https://auth.olx.com.br/oauth}
      token-url: ${OLX_TOKEN_URL:https://auth.olx.com.br/oauth/token}
      api-url: ${OLX_API_URL:https://apps.olx.com.br}
      scope: ${OLX_SCOPE:basic_user_info autoupload autoservice}
      webhook-url: ${OLX_WEBHOOK_URL:}
      delete-sold-ads: ${OLX_DELETE_SOLD_ADS:false}
      pkce: false
  stock-sync:
    retry-delay-ms: 2000

logging:
  pattern:
    console: "%d{HH:mm:ss} %-5level [%X{tenantId}] %logger{36} - %msg%n"
